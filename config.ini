[paths]

# raiz dos CAPPIs (.npy): <cappi_dir>/<preset>/<R>_<A>/<R>_<A>_<timestamp>.npy,
# observados (nwcConvert) e interpolados (nwcInterpolate) no mesmo lugar;
# <cappi_dir>/<R>_<A>/ e a raiz são o layout de antes (só as migrações leem)
cappi_dir = ./data/cappi

# banco SQLite compartilhado com o 21.mvol (volumes, processing_log, radar_sites)
# e o monrad; a tabela sequences é do nowcast
database = ./data/dbase/catalog.db

# diretório para arquivos de log
log_dir = ./logs


[log]

# nível de log: DEBUG, INFO, WARNING, ERROR
level = INFO

# arquivo onde o log de execução será gravado
file = nowcast.log


[database]

# espera máxima por lock (ms)
busy_timeout = 10000


[timeline]

# intervalo nominal entre volumes (s)
interval_s = 600

# desvio máximo entre o Δt real de dois volumes consecutivos e o múltiplo de
# interval_s mais próximo (s). Máximo e default: interval_s / 2. Valores menores
# quebram a série (slot INVALID) onde a cadência foge do nominal
tolerance_s = 300


[interpolate]

# método: flow   = optical flow (Farnebäck): desloca os dois vizinhos até o instante
#                  do slot e só então mistura (acompanha o movimento da chuva)
#         linear = média pixel a pixel, sem movimento (cross-fade)
# medido no CGU-400 (lacuna de 1 slot): MAE 4.65 dB (flow+z) x 5.84 dB (linear+dbz);
# repetir com apps/nwcInterpolBench.py
method = flow

# domínio da média: z   = refletividade linear Z = 10^(dBZ/10), preserva os picos
#                   dbz = média direta em dBZ, atenua os núcleos (~2-3 dB no p99.5)
blend = z

# lacuna máxima (slots faltantes consecutivos) preenchida por interpolação.
# Inteiro >= 0; 0 desliga a interpolação. Com vizinhos a 30 min (lacuna 2) o flow
# já perde quase toda a vantagem sobre o linear
max_gap = 2

# processos do Pool (inteiro >= 0): 0 = número de CPUs - 1, 1 = serial
workers = 0


[sequences]

# cada volume da janela precisa ter valid_fraction >= min_valid_ratio x a maior
# valid_fraction observada da série. Relativo porque a cobertura depende do
# radar: um radar de 250 km no grid de ±250 km só cobre ~78,5% (π/4) dos pixels
min_valid_ratio = 0.95

# média mínima de rain_fraction da janela (0 = sem filtro)
min_rain_fraction = 0.0

[convert]
# processos do pool (0 = CPUs − 1, 1 = serial)
workers = 0
# tentativas antes do FAILED definitivo
max_retries = 3
# idade (s) de um PROCESSING considerado preso
stale_after_s = 3600
