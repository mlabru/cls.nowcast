[pytest]
testpaths   = test
pythonpath  = apps apps/util
addopts     = -v --tb=short
# o numpy ignora este aviso do Cython (inofensivo) no seu __init__, mas o
# pytest reseta os filtros e ele reaparece no import do netCDF4 (via Py-ART)
filterwarnings =
    ignore:numpy.ndarray size changed:RuntimeWarning
markers   =
    slow: testes lentos (optical flow com arrays grandes)
    integration: testes que usam banco ou disco
